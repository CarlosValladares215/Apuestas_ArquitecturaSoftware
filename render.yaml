services:
  - type: web
    name: apuestas-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @apuestas/shared build && pnpm --filter @apuestas/api build
    startCommand: pnpm --filter @apuestas/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: apuestas-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: apuestas-redis
          property: connectionString

  - type: web
    name: apuestas-reports
    runtime: python
    plan: free
    rootDir: apps/reports
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: REPORTS_DATABASE_URL
        sync: false

  - type: redis
    name: apuestas-redis
    plan: free
    ipAllowList: []

databases:
  - name: apuestas-postgres
    plan: free
    databaseName: apuestas_db
    user: apuestas_app
