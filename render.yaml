services:
  - type: web
    name: apuestas-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @apuestas/shared build && pnpm --filter @apuestas/api build
    startCommand: pnpm --filter @apuestas/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: AUTH_STORAGE_DRIVER
        value: prisma
      - key: CAPTCHA_PROVIDER
        value: mock
      - key: EMAIL_SANDBOX_ECHO
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_FROM
        value: 'Apuestas UTPL <no-reply@apuestas-utpl.edu.ec>'
      - key: RESEND_API_KEY
        value: ''
      - key: PAYPHONE_TOKEN
        value: ''
      - key: PAYPHONE_STORE_ID
        value: ''
      - key: API_FOOTBALL_KEY
        value: ''
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_OPERATOR_EMAIL
        sync: false
      - key: SEED_OPERATOR_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: apuestas-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: apuestas-redis
          property: connectionString

  - type: web
    name: apuestas-reports
    runtime: python
    plan: free
    rootDir: apps/reports
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: REPORTS_DATABASE_URL
        value: ''

  - type: redis
    name: apuestas-redis
    plan: free
    ipAllowList: []

databases:
  - name: apuestas-postgres
    plan: free
    databaseName: apuestas_db
    user: apuestas_app
